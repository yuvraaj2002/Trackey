[package]
name = "trackey"
version = "0.1.0"
description = "Trackey — personal spend tracker"
authors = ["Yuvraj Singh"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "trackey_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"

[profile.release]
strip = true
